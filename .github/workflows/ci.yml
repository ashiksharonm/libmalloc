name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (-O0 and -O2)
        run: |
          make run
          make clean
          make run OPT=-O2
      - name: AddressSanitizer
        run: make asan
      - name: UndefinedBehaviorSanitizer
        run: make ubsan
      - name: Real programs under the malloc shim
        run: make shim-test

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make tsan

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make valgrind

  sbrk-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with the sbrk-backed arena
        run: make run CFLAGS="-Wall -Wextra -Werror -g -O1 -std=gnu11 -pthread -DLM_USE_SBRK -I./src"
